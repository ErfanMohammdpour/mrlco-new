spec_version: MARGO-SPEC-v0.1
status: phase0_closed_literature_defaults

units:
  time: seconds
  energy: joules
  data: bytes
  communication_rate: bytes_per_second

model:
  planner_type: macro_action_autoregressive
  action_space:
    0: UE
    1: MEC
    2: HELPER
  task_count: 20
  encoder:
    type: graph2seq_canonical_dag
    neighborhood: predecessor_and_successor
    gnn_layers: 2
    aggregator: masked_mean
    self_neighbor_concat: true
    direction_combine: sum
    dropout: 0.0
    max_neigh: 19
    packed_dim: 50
  # Encoder architecture freeze is Phase 2. Not copied from MR-LCO 2x256 LSTM.

energy:
  # AUTHORITATIVE accounting boundary for the research configuration. Must agree
  # with `energy_model.energy_scope`; `scheduler/energy_model.py` raises on
  # mismatch. total_mobile_joules is still produced as a secondary boundary and
  # is what MARGO-SPEC-v0.1 numbers reported.
  accounting_primary_scope: system
  legacy_scope_aliases:
    total_mobile_joules: true
  log_optional_mec_compute: true
  # DEPRECATED — LEGACY OBJECTIVE ONLY. In the constrained formulation energy is
  # a constraint channel (see spec/constraints.yaml), never a weighted objective
  # term. Kept so MARGO-SPEC-v0.1 runs reproduce byte-for-byte.
  objective_weights:
    status: legacy_only
    latency_weight: 0.5
    energy_weight: 0.5
  normalization:
    method: candidate_panel_or_pure_location
    out_of_range: clip_and_log

task_data_model:
  compute_workload_unit: bytes
  task_output_unit: bytes
  external_input_unit: bytes
  root_external_input_location: UE
  dependency_transfer_basis: edge_output_bytes
  non_root_external_input_default_bytes: 0

terminal_results:
  required_location: UE
  include_return_transfer_in_makespan: true
  transfer_bytes: task_output_bytes

resources:
  ue_cpu: { capacity: 1, preemptive: false }
  mec_ul: { capacity: 1, preemptive: false }
  mec_cpu: { capacity: 1, preemptive: false }
  mec_dl: { capacity: 1, preemptive: false }
  helper_cpu: { capacity: 1, preemptive: false }
  v2v_channel: { capacity: 1, duplex: half, preemptive: false }

resource_rates:
  # Legacy config stored Mbps as Mebibits/s. Conversion MUST stay:
  # bytes_per_second = declared_mbps * 1024 * 1024 / 8
  declared_bandwidth_unit: mebibits_per_second
  ue_cpu_bytes_per_second: 1048576        # 1.0 * 1024 * 1024
  helper_cpu_bytes_per_second: 1048576
  mec_cpu_bytes_per_second: 10485760      # 10.0 * 1024 * 1024
  mec_uplink_mbps: 7.0
  mec_downlink_mbps: 7.0
  v2v_mbps: 5.0
  mec_uplink_bytes_per_second: 917504     # 7 * 1024 * 1024 / 8
  mec_downlink_bytes_per_second: 917504
  v2v_bytes_per_second: 655360            # 5 * 1024 * 1024 / 8

power:
  rho_ue: 1.0
  f_l: 1.0
  zeta: 2.0
  ptx_mec_w: 0.1
  prx_mec_w: 0.05
  ptx_v2v_w: 0.06
  prx_v2v_w: 0.03
  rho_helper: 0.7
  f_v2v: 1.0
  # E_local = t * rho_ue * f_l^zeta
  # E_helper_cpu = t * rho_helper * f_v2v^zeta
  # E_mec_ul = t * ptx_mec_w (UE payer)
  # E_mec_dl = t * prx_mec_w (UE payer)
  # V2V: sender pays ptx_v2v_w * t, receiver pays prx_v2v_w * t

split:
  policy_version: MARGO-SPLIT-v1
  policy_file: spec/split_policy.json
  preferred_distribution_counts:
    meta_train: 15
    validation: 5
    meta_test: 5
  support_graphs_per_distribution: 20
  query_graphs_per_distribution: 80
  distribution_assignment_rule: latin_grid_holdout_v1
  graph_assignment_rule: stratified_sha256_rank_v1
  seed: 7ccf0bc4773713d76be07a79f5c82857009fec7d624f84fdce5e75ee93ea2a5d

reward_attribution:
  method: post_hoc_telescoping
  completion_policy: all_UE
  formula: r_t = J_{t-1} - gamma * J_t     # discount-consistent potential shaping
  reference: OBJECTIVE_AND_ENERGY.md#6

# ---------------------------------------------------------------------------
# Physical energy model (approved 2026-09-21). Primary research configuration.
#
#   C_i = D_i * cycles_per_bit          (cycles; cycles_per_bit is a TASK property)
#   T_cpu(i,x) = C_i / f_x              (s)
#   E_cpu(i,x) = kappa_x * C_i * f_x^2  (J)   == (kappa_x f_x^3) * T_cpu
#
# Three accounting boundaries are kept SIMULTANEOUSLY and never overwritten:
#   total_requester_joules = E_UE
#   total_mobile_joules    = E_UE + E_helper
#   total_system_joules    = E_UE + E_helper + E_MEC_compute + E_MEC_tx   <- primary
#
# Code default stays "legacy" so every existing run/tool reproduces its exact
# previous numbers; opt in via ResourceConfig.from_frozen_yaml(model="physical_v1")
# (or model=None to honour this file), or energy_model="physical_v1" in
# build_frozen_primary_stack.
# ---------------------------------------------------------------------------
energy_model:
  model: physical_v1
  energy_scope: system
  cycles_per_bit: 300.0          # Zhao2018 Table I; sweep 300 / 500 / 1000
  include_rx_energy: false       # no literature-pinned p_rx -> primary is TX-only
  tiers:
    ue:
      f_hz: 1.0e9
      kappa: 1.0e-27
      source: >-
        chosen inside the verified band (kappa 1e-28..1e-26, f 0.2..2.5 GHz);
        kappa=1e-27 matches the Gu2025/Liang2024 vehicle tier. NOT imported from
        Liu2023, which is fully offloaded and has no UE-local tier.
    helper:
      f_hz: 1.5e9
      kappa: 5.0e-27
      source: >-
        Liu et al., Digital Communications and Networks 9(6):1399-1410, 2023,
        Table 1 (F_j in [1,2] GHz, gamma_j = 5e-27); that paper's objective
        contains the service-vehicle compute energy (Eq. 15).
    mec:
      f_hz: 10.0e9
      kappa: 1.0e-27
      source: >-
        Liu et al., DCN 9(6), 2023, Table 1 (F_m = 10 GHz, gamma_m = 1e-27);
        frequency double-sourced with Zhao et al. arXiv:1807.02311 Table I.
  radio:
    ue_tx_w: 1.0                 # 30 dBm, Liu2023 Table 1
    mec_tx_w: 3.162              # 35 dBm, Zhao2018 Table I (separate provenance)
    helper_tx_w: 1.0             # assumed equal to the UE class; no helper TX published
    ue_rx_w: null                # NOT literature-pinned; needed only if include_rx_energy
    helper_rx_w: null
  # Sensitivity only — NOT part of the primary dynamic model:
  server_static_power_w: null    # P_MEC_total = P_idle + kappa f^3 (Mao COMST 2017 idle-share)
  server_utilization_model: false  # P_MEC(u) = P_idle + (P_max - P_idle) * u
  provenance: >-
    primary V2X calibration; per-parameter provenance inline. kappa > 0 for every
    tier is mandatory here: a zero MEC compute coefficient is exactly the
    asymmetry this model removes. Note the implied dynamic power
    kappa_MEC * f_MEC^3 = 1 kW, which is why the static/idle-power sensitivity
    exists. The legacy normalized model (rho=1, f=1, zeta=2) stays available for
    byte-exact reproduction of MARGO-SPEC-v0.1 numbers.

# ---------------------------------------------------------------------------
# ④ RADIO_MODEL_V1 — explicit radio physics.
#
#   R = B * eta                    (eta model; eta in bit/s/Hz)
#   R = B * log2(1 + SINR_linear)  (SINR model)
#   bytes/s = R / 8
#
# Bandwidth is a frequency span, NOT a throughput: the old "7 Mbps" table hid an
# implicit 1 bit/s/Hz.  Code default stays "legacy" (byte-exact reproduction);
# pass model="physical_v1" (or None to honour this file) to opt in.
# ---------------------------------------------------------------------------
radio_model:
  model: physical_v1
  links:
    v2i_ul:
      bandwidth_hz: 10.0e6
      rate_model: eta
      spectral_efficiency: 1.5
      assumption: false
      source: >-
        bandwidth 10 MHz from Liu et al., DCN 9(6):1399-1410, 2023, Table 1;
        spectral efficiency 1.5 bit/s/Hz from Michailidis et al., Sensors
        21(13):4392, 2021, Table 2 (r_t = 1.5 bps/Hz).
    v2i_dl:
      bandwidth_hz: 10.0e6
      rate_model: eta
      spectral_efficiency: 1.5
      assumption: false
      source: >-
        same anchors as v2i_ul; the verified papers use one V2I link in each
        direction with equal bandwidth.
    v2v:
      bandwidth_hz: 10.0e6
      rate_model: eta
      spectral_efficiency: 1.5
      assumption: true
      source: >-
        ASSUMPTION: no V2V/PC5-specific bandwidth or spectral efficiency was
        verified in the reviewed literature. Bandwidth is taken equal to the V2I
        anchor and eta equal to the Mi21 value; treat as an assumed link and
        sweep it (see spec/radio_model_report.json).
  # Alternative formulation, same interface. Set rate_model: sinr per link and
  # provide sinr_db (linear SINR = 10^(dB/10)); noise is folded into sinr_db, so
  # this remains an explicit assumption rather than a hidden default.
  sinr_example:
    rate_model: sinr
    sinr_db: 10.0
    note: "illustrative only; primary uses the eta form above"
  provenance: >-
    primary V2X radio calibration; every link carries its own source and an
    explicit assumption flag. The effective rate is what the scheduler, the
    feasibility lower bound and the energy model all consume, so changing it
    changes deadline feasibility: re-run the ③ soundness suite afterwards.

learning:
  inner_optimizer:
    name: adam
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
  inner_learning_rate: 5.0e-4
  k_steps: 3
  exact_k_semantics: optimizer_steps
  outer_update_method: mrlco_first_order_mean_pseudogradient
  outer_optimizer:
    name: adam
    learning_rate: 5.0e-4
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    state: persistent_across_outer_iterations
    applications_per_meta_batch: 1
    task_order_invariant: true
  # Forbidden alias: do not store outer Adam lr as outer_step_size / Reptile eps
  ppo_batch_size_trajectories: 20
  meta_batch_size_distributions: 10
  support_graphs_per_meta_task: 20
  trajectories_per_support_graph: 1
  support_trajectories_per_meta_task: 20
  total_optimizer_steps_per_meta_task: 3
  policy_clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  entropy_coefficient: 0.0
  entropy_claim_allowed: false
  discount_gamma: 0.99
  gae_lambda: 0.95
  advantage_normalization: true
  gradient_clip_norm: 0.5
  vf_coef: 0.5
  inner_optimizer_state: fresh_per_meta_task
  batch_shuffle: true
  outer_iterations: 3500
  validation_interval: 50
  # objective_contract_v1: the saved best-val model is chosen by the same scalar
  # that is logged and that PPO optimises (was the undiscounted reward sum).
  checkpoint_selection_metric: validation/objective_discounted_return
  checkpoint_selection_contract: objective_contract_v1
  early_stopping_rule: none_in_v0.1_fixed_budget

hyperparameter_provenance:
  policy: fixed_literature_derived_defaults
  source: MR-LCO Table 2
  source_arxiv: "2008.02033v5"
  optimization_claim: false
  validation_tuning_performed: false
  note: >
    Values were fixed before evaluation using numbers reported by MR-LCO.
    No optimality claim is made for MARGO. Meta-test was not used for tuning.
    Outer beta is Adam lr on mean pseudogradient, not Reptile outer_step_size.

legacy_reference:
  note: >
    Historical repo defects (declared_inner_grad_steps=1 as non-optimizer-step;
    sequential outer Adam per task; ambiguous batch units) MUST NOT be restored.
    See ADR-006 and LEARNING_PROTOCOL.md.
