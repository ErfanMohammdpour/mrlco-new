spec_version: MARGO-SPEC-v0.1
status: phase0_closed_literature_defaults

units:
  time: seconds
  energy: joules
  data: bytes
  communication_rate: bytes_per_second

model:
  planner_type: macro_action_autoregressive
  action_space:
    0: UE
    1: MEC
    2: HELPER
  task_count: 20
  # Architecture (encoder width etc.) is MARGO-specific; NOT copied from MR-LCO 2x256 LSTM.
  # Exact architecture freeze deferred to Phase 2.

energy:
  primary_scope: total_mobile_joules
  log_optional_mec_compute: true
  objective_weights:
    latency_weight: 0.5
    energy_weight: 0.5
  normalization:
    method: pure_location_reference_range
    out_of_range: clip_and_log

task_data_model:
  compute_workload_unit: bytes
  task_output_unit: bytes
  external_input_unit: bytes
  root_external_input_location: UE
  dependency_transfer_basis: edge_output_bytes
  non_root_external_input_default_bytes: 0

terminal_results:
  required_location: UE
  include_return_transfer_in_makespan: true
  transfer_bytes: task_output_bytes

resources:
  ue_cpu: { capacity: 1, preemptive: false }
  mec_ul: { capacity: 1, preemptive: false }
  mec_cpu: { capacity: 1, preemptive: false }
  mec_dl: { capacity: 1, preemptive: false }
  helper_cpu: { capacity: 1, preemptive: false }
  v2v_channel: { capacity: 1, duplex: half, preemptive: false }

resource_rates:
  # Legacy config stored Mbps as Mebibits/s. Conversion MUST stay:
  # bytes_per_second = declared_mbps * 1024 * 1024 / 8
  declared_bandwidth_unit: mebibits_per_second
  ue_cpu_bytes_per_second: 1048576        # 1.0 * 1024 * 1024
  helper_cpu_bytes_per_second: 1048576
  mec_cpu_bytes_per_second: 10485760      # 10.0 * 1024 * 1024
  mec_uplink_mbps: 7.0
  mec_downlink_mbps: 7.0
  v2v_mbps: 5.0
  mec_uplink_bytes_per_second: 917504     # 7 * 1024 * 1024 / 8
  mec_downlink_bytes_per_second: 917504
  v2v_bytes_per_second: 655360            # 5 * 1024 * 1024 / 8

power:
  rho_ue: 1.0
  f_l: 1.0
  zeta: 2.0
  ptx_mec_w: 0.1
  prx_mec_w: 0.05
  ptx_v2v_w: 0.06
  prx_v2v_w: 0.03
  rho_helper: 0.7
  f_v2v: 1.0
  # E_local = t * rho_ue * f_l^zeta
  # E_helper_cpu = t * rho_helper * f_v2v^zeta
  # E_mec_ul = t * ptx_mec_w (UE payer)
  # E_mec_dl = t * prx_mec_w (UE payer)
  # V2V: sender pays ptx_v2v_w * t, receiver pays prx_v2v_w * t

split:
  policy_version: MARGO-SPLIT-v1
  policy_file: spec/split_policy.json
  preferred_distribution_counts:
    meta_train: 15
    validation: 5
    meta_test: 5
  support_graphs_per_distribution: 20
  query_graphs_per_distribution: 80
  distribution_assignment_rule: latin_grid_holdout_v1
  graph_assignment_rule: stratified_sha256_rank_v1
  seed: 7ccf0bc4773713d76be07a79f5c82857009fec7d624f84fdce5e75ee93ea2a5d

reward_attribution:
  method: post_hoc_telescoping
  completion_policy: all_UE
  formula: r_t = -(0.5 * (L_t - L_{t-1}) / L_scale + 0.5 * (E_t - E_{t-1}) / E_scale)
  reference: OBJECTIVE_AND_ENERGY.md#6

learning:
  inner_optimizer:
    name: adam
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
  inner_learning_rate: 5.0e-4
  k_steps: 3
  exact_k_semantics: optimizer_steps
  outer_update_method: mrlco_first_order_mean_pseudogradient
  outer_optimizer:
    name: adam
    learning_rate: 5.0e-4
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    state: persistent_across_outer_iterations
    applications_per_meta_batch: 1
    task_order_invariant: true
  # Forbidden alias: do not store outer Adam lr as outer_step_size / Reptile eps
  ppo_batch_size_trajectories: 20
  meta_batch_size_distributions: 10
  support_graphs_per_meta_task: 20
  trajectories_per_support_graph: 1
  support_trajectories_per_meta_task: 20
  total_optimizer_steps_per_meta_task: 3
  policy_clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  entropy_coefficient: 0.0
  entropy_claim_allowed: false
  discount_gamma: 0.99
  gae_lambda: 0.95
  advantage_normalization: true
  gradient_clip_norm: 0.5
  vf_coef: 0.5
  inner_optimizer_state: fresh_per_meta_task
  batch_shuffle: true
  outer_iterations: 3500
  validation_interval: 50
  checkpoint_selection_metric: validation_query_composite_objective
  early_stopping_rule: none_in_v0.1_fixed_budget

hyperparameter_provenance:
  policy: fixed_literature_derived_defaults
  source: MR-LCO Table 2
  source_arxiv: "2008.02033v5"
  optimization_claim: false
  validation_tuning_performed: false
  note: >
    Values were fixed before evaluation using numbers reported by MR-LCO.
    No optimality claim is made for MARGO. Meta-test was not used for tuning.
    Outer beta is Adam lr on mean pseudogradient, not Reptile outer_step_size.

legacy_reference:
  note: >
    Historical repo defects (declared_inner_grad_steps=1 as non-optimizer-step;
    sequential outer Adam per task; ambiguous batch units) MUST NOT be restored.
    See ADR-006 and LEARNING_PROTOCOL.md.
