generation_rules:

  - rule_id: E2E-SLA-V1
    applies_to: application_e2e
    status: predeclared_not_yet_instantiated
    stopping_rule: >-
      search the declared primary-source list for a direct application-level
      end-to-end deadline or requirement for an autonomous-driving chain. If none
      is found within that search, STOP searching and use this rule. Do not keep
      hunting for a universal magic number, and never substitute a
      communication-scope latency or a measured execution latency for D_G.
    branches:
      - condition: direct_application_e2e_requirement_found
        outcome: use the source anchor with verification_status official_verified
          or primary_verified
      - condition: no_defensible_universal_requirement
        outcome: D_G = rho_G * P_G, where P_G is an externally defined
          activation/update period per application family and rho_G is drawn from a
          per-family set R_family frozen BEFORE any scheduling
        alternative: >-
          D_G = eta * B_G with B_G = sum over the critical path of
          Q_p(T_i) + B_comm, where p and eta are global/family-level calibration
          parameters, frozen before generation and never adjusted per graph
    required_fields_when_used:
      source_type: source_calibrated_synthetic
      semantic_role: requirement
      measurement_scope: application_e2e
      generation_rule_id: E2E-SLA-V1
    forbidden:
      - D_G = kappa * T_witness
      - choosing D_G after observing a schedule
      - describing a measured latency as an SLA

radio_semantics:
  must_be_separated: [service_required_data_rate, offered_load, achievable_capacity]
  rule: >-
    a required data rate in TS 22.186 (10 / 25 / 30 / up to 700 Mbps) is a service
    requirement, NOT a resource capacity, and must never be used as a simulated
    link rate
  resource_profiles: >-
    controlled distributions (nominal / degraded / strong) whose parameters are
    either extracted from a measurement study or explicitly labelled
    source-calibrated-synthetic with a stated rule; the historical 7/5 Mbps values
    carry no authority and are not frozen defaults
evidence_gaps:
  # Generator calibration MUST NOT start until these four groups are populated.
  - gap_id: application_e2e_deadlines
    need: source-backed application-level end-to-end deadlines or measured
      autonomous-driving chain times that can define D_G
    scope_required: application_e2e
    status: open
    candidates:
      - Autoware / ROS 2 autonomous-driving pipeline timing studies
      - measured perception-planning-control chain papers
