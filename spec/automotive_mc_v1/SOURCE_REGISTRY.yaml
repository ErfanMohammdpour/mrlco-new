# MARGO-AUTOMOTIVE-MC-v1 source registry
#
# Every external numerical parameter used anywhere in this dataset appears here
# with its clause/table and an explicit SLA scope. Nothing else may be cited.
#
# scope taxonomy (see DATASET_CONTRACT.md):
#   communication      radio/interface or message-exchange performance requirement.
#                      MAY NOT define the graph deadline D_G.
#   processing_stage   one application stage or a chain segment.
#   application_e2e    end-to-end application/safety deadline. The ONLY scope
#                      allowed to anchor D_G.
#
# label taxonomy: measured | standard-derived | trace-fitted |
#                 source-calibrated-synthetic | synthetic

schema_version: source_registry_v3
#
# allowed_for_generation = source_acceptable AND transcription_verified
#   (or, for generated values, generation_rule_verified AND generation_rule_id != ∅)
#
# source_verification says the DOCUMENT is authoritative. It says nothing about
# whether the number written in this file was transcribed correctly. That is what
# transcription_verified records, and until it is true the row may not be used by
# the generator even when the source is a standard. No row is admitted on the
# strength of its source alone.
#
# verification_status (third independent field on every numeric row):
#   official_verified          read from the official standard/document text
#   primary_verified           read from the primary paper/full text
#   peer_reviewed_verified     primary and peer reviewed
#   secondary_lead_unverified  seen only through a secondary quotation or an
#                              owner report; MAY NOT enter the generator
#   derived                    computed from verified inputs by a stated rule
#   synthetic_calibrated       generated by us under a rule whose parameters are
#                              calibrated from verified sources
#
# HARD GATE: allowed_for_generation is true only for official_verified,
# primary_verified, peer_reviewed_verified, derived, or synthetic_calibrated WITH
# a recorded generation_rule_id. A secondary lead is NOT synthetic: it is
# unverified evidence and stays out of the generator.
verification_statuses: [official_verified, primary_verified, peer_reviewed_verified,
                        secondary_lead_unverified, derived, synthetic_calibrated]
dataset: MARGO-AUTOMOTIVE-MC-v1

scope_rules:
  communication_may_not_set_D_G: true
  application_e2e_required_for_D_G: true
  range_values_need_predeclared_sampling_rule: true
  forbidden: "D_G = kappa * T_witness; any deadline chosen after observing a schedule"

