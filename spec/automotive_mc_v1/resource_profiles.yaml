# M5 resource profiles: R_p = (f_UE, f_HELPER, f_MEC, R_MEC_UL, R_MEC_DL, R_V2V)
schema_version: resource_profiles_v1

concepts:
  service_required_rate: a requirement stated by a standard (3GPP); NEVER a capacity
  offered_traffic: the load offered to a link; not a capacity either
  achievable_capacity: the only quantity that may feed scheduler timing

scheduler_uses: achievable_capacity

profiles:
  degraded:
    rule_id: RESOURCE-PROFILE-DEGRADED-V1
    evidence_class: source_calibrated_synthetic
    f_ue_hz:     {range: [0.4e9, 0.8e9],  units: Hz}
    f_helper_hz: {range: [0.5e9, 1.0e9],  units: Hz}
    f_mec_hz:    {range: [3.0e9, 7.0e9],  units: Hz}
    r_mec_ul_bps: {range: [4.0e6, 12.0e6],  units: bps}
    r_mec_dl_bps: {range: [4.0e6, 12.0e6],  units: bps}
    r_v2v_bps:    {range: [2.0e6, 6.0e6],   units: bps}
  nominal:
    rule_id: RESOURCE-PROFILE-NOMINAL-V1
    evidence_class: source_calibrated_synthetic
    f_ue_hz:     {range: [0.6e9, 1.4e9],  units: Hz}
    f_helper_hz: {range: [1.0e9, 2.0e9],  units: Hz}
    f_mec_hz:    {range: [6.0e9, 14.0e9], units: Hz}
    r_mec_ul_bps: {range: [8.0e6, 60.0e6],  units: bps}
    r_mec_dl_bps: {range: [8.0e6, 60.0e6],  units: bps}
    r_v2v_bps:    {range: [4.0e6, 30.0e6],  units: bps}
  strong:
    rule_id: RESOURCE-PROFILE-STRONG-V1
    evidence_class: source_calibrated_synthetic
    f_ue_hz:     {range: [1.2e9, 2.4e9],  units: Hz}
    f_helper_hz: {range: [2.0e9, 4.0e9],  units: Hz}
    f_mec_hz:    {range: [12.0e9, 28.0e9], units: Hz}
    r_mec_ul_bps: {range: [40.0e6, 300.0e6], units: bps}
    r_mec_dl_bps: {range: [40.0e6, 300.0e6], units: bps}
    r_v2v_bps:    {range: [20.0e6, 150.0e6], units: bps}

historical_baselines:
  note: >-
    the repository's historical points (1.0 / 1.5 / 10.0 GHz and 7/7/5 Mbps) are
    engineering baseline points that happen to lie inside the calibrated ranges;
    they are NOT verified real-world constants and carry no authority
  points_hz: {f_ue: 1.0e9, f_helper: 1.5e9, f_mec: 10.0e9}
  points_bps: {r_mec_ul: 7.0e6, r_mec_dl: 7.0e6, r_v2v: 5.0e6}

forbidden:
  - copying a 3GPP service_required_rate into achievable_capacity
  - using offered_traffic as a scheduler capacity
  - service_required_rate inside any profile's scheduler inputs
